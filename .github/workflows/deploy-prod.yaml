name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # =======================
      # DEBUG OIDC TOKEN
      # =======================
      - name: Get OIDC Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Decode OIDC Token
        run: |
          TOKEN="${{ steps.oidc.outputs.token }}"
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "===== OIDC TOKEN PAYLOAD ====="
          echo "$PAYLOAD"
          echo "=============================="
      # =======================
      # AWS LOGIN
      # =======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Verify dist folder
        run: |
          ls -la
          ls -la out
      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://${{ vars.AWS_S3_BUCKET }}/ --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"
      - name: Deployment summary
        run: |
          echo "# Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Static files deployed from dist/" >> $GITHUB_STEP_SUMMARY
